[package]
name = "telos"
version.workspace = true
edition.workspace = true

[[bin]]
name = "telos"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
telos-core = { path = "../telos-core" }
globset = "0.4"

[dev-dependencies]
assert_cmd = "2"
tempfile = "3"
