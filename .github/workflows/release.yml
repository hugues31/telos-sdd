name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing v* tag to build and (re)publish release assets for"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  frontend:
    runs-on: ubuntu-latest
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.sha }}
      - name: Resolve immutable source commit
        id: source
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v5
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Type-check frontend
        working-directory: frontend
        run: npm run typecheck
      - name: Test frontend
        working-directory: frontend
        run: npm test -- --run
      - name: Build frontend
        working-directory: frontend
        run: npm run build
      - uses: actions/upload-artifact@v7
        with:
          name: frontend-dist
          path: frontend/dist
          if-no-files-found: error

  build:
    needs: frontend
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
            os: linux
            arch: amd64
            smoke: true
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
            os: linux
            arch: arm64
            smoke: true
          - target: x86_64-apple-darwin
            runner: macos-latest
            os: darwin
            arch: amd64
            smoke: true
          - target: aarch64-apple-darwin
            runner: macos-latest
            os: darwin
            arch: arm64
            smoke: true
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
            os: windows
            arch: amd64
            smoke: true
          # No emulation on the x64 runner: build only, never smoke.
          - target: aarch64-pc-windows-msvc
            runner: windows-latest
            os: windows
            arch: arm64
            smoke: false
    runs-on: ${{ matrix.runner }}
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.frontend.outputs.source_sha }}
      - name: Set reproducible build timestamp
        shell: bash
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v8
        with:
          name: frontend-dist
          path: frontend/dist
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install musl linker support
        if: matrix.os == 'linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Refuse a tag that disagrees with the workspace version
        shell: bash
        run: |
          version="${TAG#v}"
          manifest="$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "telos") | .version')"
          if [ "$version" != "$manifest" ]; then
            echo "Tag ${TAG} does not match workspace version ${manifest}." >&2
            exit 1
          fi
      - name: Build
        run: cargo build --release --locked -p telos --target ${{ matrix.target }}
      - name: Smoke test
        if: matrix.smoke
        shell: bash
        run: |
          bin="target/${{ matrix.target }}/release/telos"
          if [ "${{ matrix.os }}" = windows ]; then bin="${bin}.exe"; fi
          "./${bin}" --version
      - name: Package archive
        shell: bash
        run: |
          version="${TAG#v}"
          mkdir -p dist/package
          if [ "${{ matrix.os }}" = windows ]; then
            cp "target/${{ matrix.target }}/release/telos.exe" dist/package/
            (cd dist/package && 7z a "../telos_${version}_windows_${{ matrix.arch }}.zip" telos.exe)
          else
            cp "target/${{ matrix.target }}/release/telos" dist/package/
            tar -C dist/package -czf "dist/telos_${version}_${{ matrix.os }}_${{ matrix.arch }}.tar.gz" telos
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: telos-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/telos_*
          if-no-files-found: error

  publish:
    needs: [frontend, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      SOURCE_SHA: ${{ needs.frontend.outputs.source_sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.frontend.outputs.source_sha }}
          fetch-depth: 0
      - name: Refuse a tag that moved after source resolution
        shell: bash
        run: |
          git check-ref-format "refs/tags/${TAG}"
          git fetch --force --no-tags origin "refs/tags/${TAG}:refs/tags/${TAG}"
          actual_sha="$(git rev-parse --verify "refs/tags/${TAG}^{commit}")"
          if [ "$actual_sha" != "$SOURCE_SHA" ]; then
            echo "Tag ${TAG} moved from ${SOURCE_SHA} to ${actual_sha}." >&2
            exit 1
          fi
      - name: Generate conventional release notes
        uses: orhun/git-cliff-action@f50e11560dce63f7c33227798f90b924471a88b5 # v4
        with:
          version: "v2.13.1"
          config: .github/cliff.toml
          args: --current --strip header
          github_token: ${{ secrets.GITHUB_TOKEN }}
        env:
          OUTPUT: release-notes.md
      - uses: actions/download-artifact@v8
        with:
          pattern: telos-*
          path: dist
          merge-multiple: true
      - name: Create checksums
        working-directory: dist
        run: sha256sum telos_* > checksums.txt
      - name: Publish GitHub Release
        run: |
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json id >/dev/null 2>&1; then
            gh release edit "$TAG" --notes-file release-notes.md -R "$GITHUB_REPOSITORY"
            gh release upload "$TAG" dist/* --clobber -R "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" dist/* --notes-file release-notes.md --verify-tag -R "$GITHUB_REPOSITORY"
          fi
