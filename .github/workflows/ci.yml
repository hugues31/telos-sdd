name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Type-check frontend
        working-directory: frontend
        run: npm run typecheck
      - name: Test frontend
        working-directory: frontend
        run: npm test -- --run
      - name: Build frontend
        working-directory: frontend
        run: npm run build
      - uses: actions/upload-artifact@v7
        with:
          name: frontend-dist
          path: frontend/dist
          if-no-files-found: error

  test:
    needs: frontend
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: frontend-dist
          path: frontend/dist
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace
      - name: Prove spec-only Billing reconstruction
        if: runner.os == 'Linux'
        run: cargo test -p telos --test rebuild_demo
      - name: Run cargo test --workspace
        if: runner.os != 'Windows'
        run: cargo test --workspace
      - name: Run cargo test --workspace
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cargo test --workspace 2>&1 | Tee-Object -FilePath cargo-test.log
          $testExit = $LASTEXITCODE
          if ($testExit -ne 0) {
            $tail = (Get-Content cargo-test.log -Tail 160) -join "`n"
            "## Windows cargo test failure`n`n``````text`n$tail`n``````" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
            $annotation = $tail.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error title=Windows cargo test output::$annotation"
            exit $testExit
          }
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - name: cargo fmt
        if: runner.os == 'Linux'
        run: cargo fmt --all --check
      - name: Prove the musl release target still links
        if: runner.os == 'Linux'
        run: |
          rustup target add x86_64-unknown-linux-musl
          sudo apt-get update && sudo apt-get install -y musl-tools
          cargo build --locked -p telos --target x86_64-unknown-linux-musl
