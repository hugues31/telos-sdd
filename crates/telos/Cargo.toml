[package]
name = "telos"
version.workspace = true
edition.workspace = true

[[bin]]
name = "telos"
path = "src/main.rs"

[dependencies]
axum = "0.8"
cap-fs-ext = "4.0.2"
cap-std = "4.0.2"
clap = { version = "4", features = ["derive"] }
notify = "8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
telos-core = { path = "../telos-core" }
globset = "0.4"
tokio = { version = "1", features = ["net", "rt", "sync", "time"] }

[dev-dependencies]
assert_cmd = "2"
tempfile = "3"
