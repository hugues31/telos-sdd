name: Telos integrity

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false
      - name: Install Telos
        run: go install github.com/hugues31/telos-sdd/cmd/telos@latest
      - name: Verify spec-code integrity
        run: telos verify --json
