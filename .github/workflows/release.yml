name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false
      - name: Build archive
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir -p dist/package
          binary="telos"
          if [ "$GOOS" = windows ]; then binary="telos.exe"; fi
          go build -trimpath -ldflags "-s -w -X main.version=${version}" -o "dist/package/${binary}" ./cmd/telos
          if [ "$GOOS" = windows ]; then
            (cd dist/package && zip "../telos_${version}_${GOOS}_${GOARCH}.zip" "$binary")
          else
            tar -C dist/package -czf "dist/telos_${version}_${GOOS}_${GOARCH}.tar.gz" "$binary"
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: telos-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/telos_*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Create checksums
        working-directory: dist
        run: sha256sum telos_* > checksums.txt
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes --verify-tag
