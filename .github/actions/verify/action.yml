name: Verify Telos integrity
description: Install Telos and verify that spec and code are in sync in a repository

inputs:
  version:
    description: Go module version to install
    required: false
    default: v0.6.0

runs:
  using: composite
  steps:
    - uses: actions/setup-go@v7
      with:
        go-version: stable
        cache: false
    - name: Install Telos
      shell: bash
      run: go install github.com/hugues31/telos-sdd/cmd/telos@${{ inputs.version }}
    - name: Verify Telos
      shell: bash
      run: telos verify --json
