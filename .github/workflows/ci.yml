name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  release-notes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install git-cliff and smoke-test the configuration
        uses: orhun/git-cliff-action@f50e11560dce63f7c33227798f90b924471a88b5 # v4
        with:
          version: "v2.13.1"
          config: .github/cliff.toml
          args: --latest --strip header
          github_token: ${{ secrets.GITHUB_TOKEN }}
        env:
          OUTPUT: ${{ runner.temp }}/release-notes.md
      - name: Test conventional release notes
        run: .github/scripts/test-release-notes.sh "$RUNNER_TEMP/git-cliff/bin/git-cliff"

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Type-check frontend
        working-directory: frontend
        run: npm run typecheck
      - name: Test frontend
        working-directory: frontend
        run: npm test -- --run
      - name: Build frontend
        working-directory: frontend
        run: npm run build
      - uses: actions/upload-artifact@v7
        with:
          name: frontend-dist
          path: frontend/dist
          if-no-files-found: error

  test:
    needs: frontend
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: frontend-dist
          path: frontend/dist
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace
      - name: Prove spec-only Billing reconstruction
        if: runner.os == 'Linux'
        run: cargo test -p telos --test rebuild_demo
      - name: Run cargo test --workspace
        if: runner.os != 'Windows'
        run: cargo test --workspace
      - name: Run cargo test --workspace
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cargo test --workspace 2>&1 | Tee-Object -FilePath cargo-test.log
          $testExit = $LASTEXITCODE
          if ($testExit -ne 0) {
            $tail = (Get-Content cargo-test.log -Tail 160) -join "`n"
            "## Windows cargo test failure`n`n``````text`n$tail`n``````" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
            $matches = Select-String -Path cargo-test.log -Pattern @(
              '^---- .* stdout ----$',
              'panicked at',
              '^failures:$',
              '^test result: FAILED'
            ) -Context 1,3
            foreach ($match in $matches) {
              $block = (@($match.Context.PreContext) + $match.Line + @($match.Context.PostContext)) -join "`n"
              $annotation = $block.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
              Write-Output "::error title=Windows cargo test failure at log line $($match.LineNumber)::$annotation"
            }
            exit $testExit
          }
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - name: cargo fmt
        if: runner.os == 'Linux'
        run: cargo fmt --all --check
      - name: Prove the musl release target still links
        if: runner.os == 'Linux'
        run: |
          rustup target add x86_64-unknown-linux-musl
          sudo apt-get update && sudo apt-get install -y musl-tools
          cargo build --locked -p telos --target x86_64-unknown-linux-musl
